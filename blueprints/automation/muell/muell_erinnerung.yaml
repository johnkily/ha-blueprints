blueprint:
  name: Müll – Erinnerung am Vorabend
  description: >
    Schickt am Vorabend eine Nachricht aufs Handy, welche Tonne morgen
    abgeholt wird – zum Beispiel „🟦 Morgen: Papier“. Liest jeden
    Abfallkalender, der in Home Assistant als Kalender vorliegt (ICS-Link der
    Stadt über „Remote Calendar“, Waste Collection Schedule, eigener Kalender).
    Stehen mehrere Tonnen an, kommen alle in eine Nachricht.


    Anleitung: https://github.com/johnkily/ha-blueprints/blob/main/docs/muell.md – gefällt er dir? Ein ⭐ auf GitHub hilft anderen, ihn zu finden.


    Waste reminder: notifies your phones the evening before a pickup. Like it? A ⭐ on GitHub helps others find it.
  domain: automation
  author: johnkily
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/johnkily/ha-blueprints/blob/main/blueprints/automation/muell/muell_erinnerung.yaml
  input:
    kalender:
      name: Abfallkalender
      selector:
        entity:
          filter:
            - domain: calendar
    uhrzeit:
      name: Uhrzeit der Erinnerung
      default: "19:00:00"
      selector:
        time:
    handys:
      name: Handys
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    nur_zuhause:
      name: Nur Handys, die zu Hause sind
      description: >-
        Unterwegs kann niemand die Tonne rausstellen. Ist gerade niemand zu Hause,
        bekommen alle Bescheid. Aus = immer alle Handys.
      default: false
      selector:
        boolean:
    bestaetigen:
      name: Erinnern, bis jemand „Rausgestellt“ tippt
      collapsed: true
      input:
        wiederholen:
          name: Wiederholen, bis bestätigt
          description: >-
            Die Nachricht bekommt einen Knopf „Rausgestellt ✅“. Bis jemand tippt, kommt sie
            im eingestellten Abstand wieder – längstens bis zur letzten Erinnerung (am selben Abend).
          default: false
          selector:
            boolean:
        abstand:
          name: Abstand
          default: 60
          selector:
            number:
              min: 15
              max: 180
              unit_of_measurement: min
        bis:
          name: Letzte Erinnerung um
          default: "21:00:00"
          selector:
            time:
        merker:
          name: Datums-Helfer fürs Dashboard (optional)
          description: >-
            Helfer „Datum und/oder Uhrzeit“ mit nur Datum. Nach dem Tippen steht dort das
            Abholdatum – die Müll-Karte zeigt dann „✓ Draußen“ statt zu wackeln.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        pause:
          name: Nicht erinnern, solange eingeschaltet (optional)
          description: Zum Beispiel der Schalter für den Urlaubsmodus.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
    sorten:
      name: Tonnen
      description: >-
        Welche Wörter im Kalendereintrag zu welcher Tonne gehören. Mehrere mit Komma trennen,
        Groß-/Kleinschreibung egal. Ein ! davor schließt aus: `Restmüll, !Container` erkennt
        „Restmüll“, aber nicht „Restmüll Container“.
      collapsed: true
      input:
        rest_woerter:
          name: Restmüll – Stichwörter
          default: Rest, Grau, Schwarz
          selector:
            text:
        papier_woerter:
          name: Papier – Stichwörter
          default: Papier, Blau, PPK
          selector:
            text:
        gelb_woerter:
          name: Gelber Sack / Wertstoff – Stichwörter
          default: Gelb, Wertstoff, Verpackung, Leichtverpackung
          selector:
            text:
        bio_woerter:
          name: Bio – Stichwörter
          default: Bio, Grün, Braun, Kompost
          selector:
            text:

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    at: !input uhrzeit
    id: erinnern
  # Tippen auf „Rausgestellt“, nachdem die Erinnerungen schon vorbei sind
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MUELL_RAUS
    id: bestaetigt

variables:
  kalender: !input kalender
  handys: !input handys
  nur_zuhause: !input nur_zuhause
  wiederholen: !input wiederholen
  abstand: !input abstand
  bis: !input bis
  merker: !input merker
  pause: !input pause
  sorten:
    - name: Restmüll
      zeichen: ⬛
      woerter: !input rest_woerter
    - name: Papier
      zeichen: 🟦
      woerter: !input papier_woerter
    - name: Gelber Sack
      zeichen: 🟨
      woerter: !input gelb_woerter
    - name: Bio
      zeichen: 🟫
      woerter: !input bio_woerter

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id | default('') == 'bestaetigt' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ merker != '' }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ merker }}"
            data:
              date: "{{ (now() + timedelta(days=0 if now().hour < 12 else 1)).date().isoformat() }}"
      - repeat:
          for_each: "{{ handys }}"
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              continue_on_error: true
              data:
                message: clear_notification
                data:
                  tag: muell
      - stop: Bestätigt
  - condition: template
    value_template: "{{ pause == '' or not is_state(pause, 'on') }}"
  - action: calendar.get_events
    target:
      entity_id: "{{ kalender }}"
    data:
      start_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
      end_date_time: "{{ today_at('00:00') + timedelta(days=2) }}"
    response_variable: termine
  - variables:
      morgen: "{{ (now() + timedelta(days=1)).date().isoformat() }}"
      # Jede Tonne nur einmal; unbekannte Einträge mit ihrem eigenen Titel
      tonnen: >
        {% set ns = namespace(l=[]) %}
        {% for e in termine[kalender].events if e.start[:10] == morgen %}
          {% set titel = e.summary | lower %}
          {% set ns2 = namespace(t=none) %}
          {% for s in sorten if ns2.t is none %}
            {% set w = s.woerter.split(',') | map('trim') | map('lower') | reject('eq', '') | list %}{% set plus = w | reject('match', '!') | list %}{% set minus = w | select('match', '!') | map('replace', '!', '', 1) | map('trim') | reject('eq', '') | list %}
            {% if plus | select('in', titel) | list | count > 0 and minus | select('in', titel) | list | count == 0 %}{% set ns2.t = s.zeichen ~ ' ' ~ s.name %}{% endif %}
          {% endfor %}
          {% set t = ns2.t if ns2.t is not none else '🗑️ ' ~ e.summary %}
          {% if t not in ns.l %}{% set ns.l = ns.l + [t] %}{% endif %}
        {% endfor %}
        {{ ns.l }}
      empfaenger: >
        {% set ns = namespace(l=[]) %}
        {% for d in handys %}
          {% set tr = device_entities(d) | select('match', 'device_tracker\.') | list %}
          {% if not nur_zuhause or (tr | count > 0 and is_state(tr[0], 'home')) %}{% set ns.l = ns.l + [d] %}{% endif %}
        {% endfor %}{{ ns.l if ns.l else handys }}
  - condition: template
    value_template: "{{ tonnen | count > 0 }}"
  # Schon bestätigt (z. B. früher am Abend per Knopf)? Dann Ruhe.
  - condition: template
    value_template: "{{ merker == '' or states(merker) != morgen }}"
  - repeat:
      sequence:
        - repeat:
            for_each: "{{ empfaenger }}"
            sequence:
              - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                continue_on_error: true
                data:
                  title: "Morgen ist Abholung"
                  message: >-
                    {{ tonnen | join(', ') }} – bitte heute Abend rausstellen.
                  data: >-
                    {% set d = {'tag': 'muell'} %}
                    {% if wiederholen %}{% set d = dict(d, actions=[{'action': 'MUELL_RAUS', 'title': 'Rausgestellt ✅'}]) %}{% endif %}
                    {{ d }}
        - if:
            - condition: template
              value_template: "{{ wiederholen }}"
          then:
            - wait_for_trigger:
                - trigger: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: MUELL_RAUS
              timeout:
                minutes: "{{ abstand | float(60) }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ merker != '' }}"
                  then:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: "{{ merker }}"
                      data:
                        date: "{{ morgen }}"
                - repeat:
                    for_each: "{{ handys }}"
                    sequence:
                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        continue_on_error: true
                        data:
                          message: clear_notification
                          data:
                            tag: muell
            # Wer jetzt unterwegs ist, bekommt die nächste Erinnerung nicht mehr
            - variables:
                empfaenger: >
                  {% set ns = namespace(l=[]) %}
                  {% for d in handys %}
                    {% set tr = device_entities(d) | select('match', 'device_tracker\.') | list %}
                    {% if not nur_zuhause or (tr | count > 0 and is_state(tr[0], 'home')) %}{% set ns.l = ns.l + [d] %}{% endif %}
                  {% endfor %}{{ ns.l if ns.l else handys }}
      until:
        - condition: template
          value_template: >
            {{ not wiederholen
               or (wait is defined and wait.trigger is not none)
               or (pause != '' and is_state(pause, 'on'))
               or now().strftime('%H:%M') > bis[:5] }}
